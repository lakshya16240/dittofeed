# Builds the fork's own images and publishes them to GHCR.
#
# Upstream publishes to Docker Hub under `dittofeed/*`, which this fork cannot
# push to. GHCR is used instead because it authenticates with the built-in
# GITHUB_TOKEN, so a fork needs no configured secrets to deploy.
#
# Only the `lite` image is built. That image already contains the api,
# dashboard, worker and admin-cli bundles, so it serves all three production
# roles (web, worker, migrations) from one tag. Building the other four images
# would quintuple CI time and, more importantly, invite a version skew where
# the admin-cli running migrations is not the code the app is running.
name: Publish Docker image

on:
  # Tag-driven releases are the normal path: `git tag v0.24.0-saya.1 && git push --tags`.
  push:
    tags: ["v*"]
  # Manual builds for testing a branch before tagging it.
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build"
        required: false
        default: ""
  release:
    types: [published]

jobs:
  push_to_registry:
    name: Push Docker image to GHCR
    strategy:
      matrix:
        package: [lite]

    runs-on: ubuntu-latest

    # `packages: write` is what lets GITHUB_TOKEN push to ghcr.io. Without it
    # the push fails with a 403 that reads like a credential problem.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # Minimize what is removed to keep the action fast,
          # but remove large items like android and dotnet
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/dittofeed-${{ matrix.package }}
          # A long SHA tag is always emitted so production can pin an immutable
          # digest-equivalent tag rather than a moving one.
          tags: |
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Get current git revision
        id: git_revision
        run: echo "REVISION=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/${{ matrix.package }}/Dockerfile
          push: true
          # amd64 only. arm64 would be emulated through QEMU, and the Next.js
          # dashboard build under emulation takes roughly an hour. Add
          # linux/arm64 back here only if the deployment target is arm.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ steps.git_revision.outputs.REVISION }}
